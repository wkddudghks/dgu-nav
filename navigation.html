<title>신공학관 길찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: wayfinding sign — controls bar, floor plan canvas, route card beside (stacks on phones) */
:root {
  --bg: #f4f3f7; --surface: #ffffff; --ink: #1d1b26; --muted: #6b6878; --line: #dcd9e4;
  --corridor: #e4e1ec; --room: #ffffff; --room-edge: #cfcbd9; --room-ink: #4a4757;
  --accent: #8a1f6b; --accent-ink: #ffffff; --route: #d4205f;
  --stair: #f4e3b5; --stair-ink: #7a5a00; --ev: #cdebdc; --ev-ink: #1d6b48; --wc: #e6e8f2; --void: #efedf3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --surface: #1e1c26; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2b38;
  --corridor: #2b2836; --room: #1f1d28; --room-edge: #3a3646; --room-ink: #b9b6c6;
  --accent: #d55aa8; --accent-ink: #1a0f17; --route: #ff4f86;
  --stair: #4a3b1c; --stair-ink: #f2c55b; --ev: #1d3f31; --ev-ink: #6fe0ae; --wc: #262836; --void: #191820;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15141b; --surface: #1e1c26; --ink: #ecebf2; --muted: #9a97a8; --line: #2e2b38;
  --corridor: #2b2836; --room: #1f1d28; --room-edge: #3a3646; --room-ink: #b9b6c6;
  --accent: #d55aa8; --accent-ink: #1a0f17; --route: #ff4f86;
  --stair: #4a3b1c; --stair-ink: #f2c55b; --ev: #1d3f31; --ev-ink: #6fe0ae; --wc: #262836; --void: #191820;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; }
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; }
.brand { display: grid; gap: 2px; margin-right: auto; }
.brand small { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; width: 100%; max-width: 320px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swap { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; align-self: end; }
.swap:hover { border-color: var(--accent); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.tabs { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; font-weight: 500; border: 0; border-radius: 6px; padding: 6px 14px;
  background: var(--corridor); color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.tabs button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--route); margin-left: 6px; vertical-align: middle; }
.tabs .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.scroll { overflow-x: auto; }
canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: manipulation; }
@media (max-width: 860px) { canvas { width: 960px; max-width: none; } }
aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.summary { display: grid; gap: 2px; }
.summary .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary .sub { color: var(--muted); font-size: 13px; }
ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: s; }
ol li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); line-height: 1.45; }
ol li::before { content: counter(s); font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
ol li.floor { color: var(--accent); font-weight: 700; }
ol li.end { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--line); padding-top: 10px; }
.note code { font-family: var(--font-mono); font-size: 11px; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } select { max-width: none; } .field { flex: 1 1 160px; } .brand { flex-basis: 100%; } }
@media (prefers-reduced-motion: no-preference) { canvas { transition: opacity .15s; } }
</style>

  <header>
    <div class="brand"><small>동국대학교 신공학관</small><h1>신공학관 길찾기</h1></div>

        <span style="--c: var(--ev)">엘리베이터</span>
        <span style="--c: var(--wc)">화장실</span>
      </div>
      <div class="note">걷는 속도 분당 약 70m 기준. 지도는 6층 안내도를 바탕으로 만들었고 모든 층의 구조가 같아요. ESP32 비콘으로 위치를 자동으로 잡는 실시간 버전은 노트북 서버(<code>share.bat</code>)로 실행해요.</div>
    </aside>
  </main>
</div>
